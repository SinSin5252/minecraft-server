services:
  mc-server:
    build: .
    tty: true
    stdin_open: true
    ports:
      - "8888:25565"
    environment:
      EULA: "TRUE"
      MEMORY_MIN: ${MEMORY_MIN}
      MEMORY_MAX: ${MEMORY_MAX}
    volumes:
      # attach the relative directory 'data' to the container's /data path
      - ./minecraft:/minecraft/
    restart: unless-stopped